services:
  postgres:
    image: postgres:16-alpine
    container_name: echogpt-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: echopassword
      POSTGRES_DB: echogpt_db
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: